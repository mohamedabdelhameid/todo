<div class="my-5">
    <div class="rounded-2xl p-4 bg-white border border-gray-100 shadow-sm">

  <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
    <div class="flex-1 flex items-center gap-2 px-4 py-3 rounded-xl bg-gray-50 border border-gray-200">
      <svg class="w-5 h-5 text-emerald-700 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <input
        type="text"
        [formControl]="newTodo"
        placeholder="What needs to be done? e.g., Deploy v1.2 release..."
        class="flex-1 bg-transparent outline-none text-gray-700 placeholder-gray-400 text-sm min-w-0"
      />
    </div>

    <button
      class="flex cursor-pointer items-center justify-center gap-2 px-5 py-3 rounded-xl bg-emerald-800 hover:bg-emerald-900 transition-colors text-white text-sm font-medium shrink-0 disabled:bg-emerald-600 disabled:cursor-not-allowed w-full sm:w-auto"
      (click)="addNewTodo()"
      [disabled]="newTodo.invalid">
      @if(!addLoading()){
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        Add Task
      } @else {
        loading...
      }
    </button>
  </div>

</div>
</div>
